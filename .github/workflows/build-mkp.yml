name: Build MKP Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the MKP to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed so `git describe --tags` can see tags

      - name: Build MKP package
        run: bash scripts/build-mkp.sh

      - name: Upload MKP as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netapp_storagegrid-mkp
          path: dist/*.mkp
          if-no-files-found: error

      - name: Attach MKP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" dist/*.mkp --clobber \
            || gh release create "$TAG" dist/*.mkp --title "$TAG" --generate-notes
